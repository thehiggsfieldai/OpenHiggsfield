services:
  studio:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env
    environment:
      DATA_DIR: /data
      STORY_ASSETS: /app/apps/story-studio/dist
    volumes: ["studio-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
volumes:
  studio-data:
