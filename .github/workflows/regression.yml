name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix apps/story-studio
      - run: npm run build
      - run: npm test
      - run: node scripts/test-story-studio.mjs
      - run: node scripts/test-story-films.mjs --fal --recommended
